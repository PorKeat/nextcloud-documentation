apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud-system
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - name: nextcloud
        image: nextcloud:34.0.2-apache
        ports:
        - containerPort: 80
        env:
        - name: POSTGRES_HOST
          value: "nextcloud-db-rw"
        - name: POSTGRES_DB
          value: "nextcloud"
        - name: POSTGRES_USER
          value: "<DB_USER>"
        - name: POSTGRES_PASSWORD
          value: "<DB_PASSWORD>"
        - name: NEXTCLOUD_ADMIN_USER
          value: "<ADMIN_USER>"
        - name: NEXTCLOUD_ADMIN_PASSWORD
          value: "<ADMIN_PASSWORD>"
        - name: OVERWRITEPROTOCOL
          value: "https"
        - name: OVERWRITECLIURL
          value: "https://nextcloud.example.com"
        - name: OBJECTSTORE_S3_HOST
          value: "10.1.18.7"
        - name: OBJECTSTORE_S3_PORT
          value: "9000"
        - name: OBJECTSTORE_S3_SSL
          value: "true"
        - name: OBJECTSTORE_S3_BUCKET
          value: "nextcloud-data"
        - name: OBJECTSTORE_S3_KEY
          value: "<S3_ACCESS_KEY>"
        - name: OBJECTSTORE_S3_SECRET
          value: "<S3_SECRET_KEY>"
        - name: OBJECTSTORE_S3_REGION
          value: "us-east-1"
        - name: OBJECTSTORE_S3_USEPATH_STYLE
          value: "true"
        - name: PHP_MEMORY_LIMIT
          value: "1024M"
        readinessProbe:
          httpGet:
            path: /status.php
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /status.php
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
        volumeMounts:
        - name: nextcloud-data
          mountPath: /var/www/html
      volumes:
      - name: nextcloud-data
        persistentVolumeClaim:
          claimName: nextcloud-app-pvc
