# ==============================================================================
# Keycloak Ingress Architecture: Single Domain (auth.sengporkeat.com)
# Routing from Traefik NodePort 31497 -> Keycloak VM (10.1.18.6:9090)
# ==============================================================================

# 1. External Service & Endpoints mapping to Keycloak VM
apiVersion: v1
kind: Service
metadata:
  name: keycloak-vm-service
  namespace: nextcloud-system
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Endpoints
metadata:
  name: keycloak-vm-service
  namespace: nextcloud-system
subsets:
- addresses:
  - ip: 10.1.18.6
  ports:
  - name: http
    port: 9090
---
# 2. Redirect Root '/' to Realm 'unity-workspace'
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-realm-redirect
  namespace: nextcloud-system
spec:
  redirectRegex:
    regex: ^https?://auth\.sengporkeat\.com/?$
    replacement: https://auth.sengporkeat.com/realms/unity-workspace/account/
    permanent: false
---
# 3. IP Allowlist Middleware (Office Wi-Fi + VPN Subnets)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: office-vpn-allowlist
  namespace: nextcloud-system
spec:
  ipAllowList:
    sourceRange:
    - 10.1.16.0/24      # Office Wi-Fi / Internal K8s Subnet
    - 10.20.0.0/24      # Office VPN Subnet CIDR
    - 10.1.18.0/24      # WAF Internal Proxy Network
    - 103.189.186.0/23  # Public Office / WAF Network
    - 172.31.0.0/16     # Internal Transit / L2TP Network
---
# 4. Root Redirect IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-root-redirect
  namespace: nextcloud-system
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`auth.sengporkeat.com`) && Path(`/`)
    middlewares:
    - name: keycloak-realm-redirect
      namespace: nextcloud-system
    - name: nextcloud-security-headers
      namespace: nextcloud-system
    services:
    - name: keycloak-vm-service
      port: 9090
---
# 5. Public Route: Authentication & Nextcloud OIDC (Everything except /admin)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-public-route
  namespace: nextcloud-system
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`auth.sengporkeat.com`) && !PathPrefix(`/admin`)
    middlewares:
    - name: nextcloud-security-headers
      namespace: nextcloud-system
    services:
    - name: keycloak-vm-service
      port: 9090
---
# 6. Protected Route: Admin Console (Office Wi-Fi / VPN ONLY)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-admin-route
  namespace: nextcloud-system
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`auth.sengporkeat.com`) && PathPrefix(`/admin`)
    middlewares:
    - name: office-vpn-allowlist
      namespace: nextcloud-system
    - name: nextcloud-security-headers
      namespace: nextcloud-system
    services:
    - name: keycloak-vm-service
      port: 9090
