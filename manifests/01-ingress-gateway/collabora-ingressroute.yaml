apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collabora-ingress
  namespace: nextcloud-system
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`office.unity-workspace.com`)
    services:
    - name: collabora
      port: 9980
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collabora-ingress-tls
  namespace: nextcloud-system
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`office.unity-workspace.com`)
    services:
    - name: collabora
      port: 9980
  tls:
    options:
      name: tls13-strict
