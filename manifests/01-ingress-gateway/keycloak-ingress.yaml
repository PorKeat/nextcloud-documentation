# ==============================================================================
# Keycloak Ingress Architecture: Single Domain (auth.sengporkeat.com)
# Office Wi-Fi ONLY for /admin | Public Worldwide Access for Nextcloud SSO
# ==============================================================================

# 1. External Service & Endpoints mapping to Keycloak VM
apiVersion: v1
kind: Service
metadata:
  name: keycloak-vm-service
  namespace: nextcloud-system
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Endpoints
metadata:
  name: keycloak-vm-service
  namespace: nextcloud-system
subsets:
- addresses:
  - ip: 10.1.18.6
  ports:
  - name: http
    port: 9090
---
# 2. Redirect Root '/' to Realm 'unity-workspace'
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-realm-redirect
  namespace: nextcloud-system
spec:
  redirectRegex:
    regex: ^https?://auth\.(unity-workspace\.com|sengporkeat\.com)/?$
    replacement: https://auth.unity-workspace.com/realms/unity-workspace/account/
    permanent: false
---
# 3. IP Allowlist Middleware (Office Wi-Fi Subnets ONLY)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: office-wifi-allowlist
  namespace: nextcloud-system
spec:
  ipAllowList:
    sourceRange:
    - 10.1.16.0/24      # Office Local Wi-Fi Subnet
    - 10.1.18.0/24      # WAF Internal Proxy Network
    - 103.189.186.0/23  # Office Public ISP IP Range
---
# 4. Root Redirect IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-root-redirect
  namespace: nextcloud-system
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: (Host(`auth.unity-workspace.com`) || Host(`auth.sengporkeat.com`)) && Path(`/`)
    middlewares:
    - name: keycloak-realm-redirect
      namespace: nextcloud-system
    - name: nextcloud-security-headers
      namespace: nextcloud-system
    services:
    - name: keycloak-vm-service
      port: 9090
---
# 5. Public Route: Open Worldwide (Nextcloud SSO Logins & Tokens)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-public-route
  namespace: nextcloud-system
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    # Allows all user logins, tokens, and resources; excludes /admin
    match: (Host(`auth.unity-workspace.com`) || Host(`auth.sengporkeat.com`)) && !PathPrefix(`/admin`)
    middlewares:
    - name: nextcloud-security-headers
      namespace: nextcloud-system
    services:
    - name: keycloak-vm-service
      port: 9090
---
# 6. Protected Route: Keycloak Admin Console (Office Wi-Fi ONLY)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-admin-route
  namespace: nextcloud-system
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    # Protects /admin with Office Wi-Fi IP Allowlist
    match: (Host(`auth.unity-workspace.com`) || Host(`auth.sengporkeat.com`)) && PathPrefix(`/admin`)
    middlewares:
    - name: office-wifi-allowlist
      namespace: nextcloud-system
    - name: nextcloud-security-headers
      namespace: nextcloud-system
    services:
    - name: keycloak-vm-service
      port: 9090
