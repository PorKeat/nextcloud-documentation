apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-db-backup
  namespace: nextcloud-system
spec:
  schedule: "0 2 * * *" # Runs every night at 2:00 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: pg-dump-to-minio
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting Nextcloud Database Backup..."
              BACKUP_FILE="/tmp/nextcloud-db-$(date +%F-%H%M).sql.gz"
              
              echo "Dumping PostgreSQL database into memory..."
              PGPASSWORD=$DB_PASSWORD pg_dump -h nextcloud-db-rw -U admin -d nextcloud | gzip > $BACKUP_FILE
              
              echo "Downloading MinIO Client..."
              wget -qO /tmp/mc https://dl.min.io/client/mc/release/linux-amd64/mc
              chmod +x /tmp/mc
              
              echo "Uploading backup to MinIO (db-backups bucket)..."
              /tmp/mc alias set myminio https://10.1.18.7:9000 $MINIO_ACCESS_KEY $MINIO_SECRET_KEY --insecure
              /tmp/mc cp $BACKUP_FILE myminio/db-backups/ --insecure
              
              echo "✅ Database Backup Successfully Uploaded!"
            env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-credentials
                  key: password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-backup-credentials
                  key: access_key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-backup-credentials
                  key: secret_key
