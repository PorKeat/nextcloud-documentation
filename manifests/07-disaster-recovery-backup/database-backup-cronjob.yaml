apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-db-backup
  namespace: nextcloud-system
spec:
  schedule: "0 2 * * *" # Runs every night at 2:00 AM UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: pg-dump-to-minio
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "==> Starting Nextcloud PostgreSQL Database Backup..."
              BACKUP_FILE="/tmp/nextcloud-db-$(date +%F-%H%M).sql.gz"
              
              echo "==> Dumping PostgreSQL database into memory..."
              PGPASSWORD="$DB_PASSWORD" pg_dump -h nextcloud-db-rw -U admin -d nextcloud | gzip > "$BACKUP_FILE"
              
              echo "==> Downloading MinIO Client (mc)..."
              wget -qO /tmp/mc https://dl.min.io/client/mc/release/linux-amd64/mc
              chmod +x /tmp/mc
              
              echo "==> Configuring MinIO connection..."
              /tmp/mc alias set myminio https://10.1.18.7:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" --insecure
              
              echo "==> Uploading dump to MinIO db-backups bucket..."
              /tmp/mc cp "$BACKUP_FILE" myminio/db-backups/ --insecure
              
              echo "==> Auto-purging database dumps older than 7 days (7-Day Rolling Retention)..."
              /tmp/mc rm --recursive --force --older-than 7d myminio/db-backups/ --insecure || true
              
              echo "✅ Database Backup & 7-Day Pruning Completed Successfully!"
            env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-enterprise-secrets
                  key: db-pass
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: nextcloud-enterprise-secrets
                  key: minio-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nextcloud-enterprise-secrets
                  key: minio-secret
